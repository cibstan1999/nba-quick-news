name: Validate NBA News Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-news.yml'

permissions:
  contents: read

concurrency:
  group: validate-news-pipeline
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test content pipeline
        run: npm test

      - name: Build site
        run: npm run build
